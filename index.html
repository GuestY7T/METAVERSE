<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>METAVERSE Redirect</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: #07151d; color: #edf8ff; font-family: Arial, sans-serif;
      display: grid; place-items: center;
    }
    .card {
      max-width: 620px; padding: 28px 32px; border-radius: 16px;
      background: rgba(13, 37, 53, 0.92); border: 1px solid #2b5b77; box-shadow: 0 18px 48px rgba(0,0,0,0.35);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 4vw, 2.5rem); }
    p { margin: 0 0 18px; color: #cfe9f9; line-height: 1.55; }
    a {
      display: inline-block; padding: 10px 18px; border-radius: 10px;
      color: #051b2a; background: #7ad7ff; text-decoration: none; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>METAVERSE</h1>
    <p>Redirecting to the active app in <strong>METAVERSE-main/</strong>...</p>
    <a href="./METAVERSE-main/index.html">Open active app</a>
  </div>

  <script>
    window.location.replace('./METAVERSE-main/index.html');
  </script>
</body>
</html>
